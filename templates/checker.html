<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Security Checker | CyberSafe</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <nav>

        <h2>🛡 CyberSafe</h2>

        <div>

            <a href="{{ url_for('home') }}">Home</a>

            <a href="{{ url_for('checker') }}">
                Security Checker
            </a>

        </div>

    </nav>

</header>


<main class="container">

    <div class="checker-box">

        <div class="tag">
            SECURITY CHECKER
        </div>

        <h1>
            Check Your Password
        </h1>

        <p class="description">
            Enter your password below to check its security.
        </p>


        <form method="POST"
              action="{{ url_for('checker') }}">

            <div class="input-area">

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit">
                Check Security
            </button>

        </form>

    </div>

</main>


<footer>

    © 2026 CyberSafe | Cyber Security Awareness

</footer>

</body>

</html>
